<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="login.css">

</head>

<body>

<div class="login-container">

  <div class="login-card">

    <img
    src="images/default.jpg"
    alt="Gaming Image">

    <h1>Gaming News Hub</h1>

    <p>
      Login to continue
    </p>

    <form>

      <input
      type="text"
      placeholder="Username">

      <input
      type="password"
      placeholder="Password">

      <button type="submit">
        Login
      </button>

    </form>

    <a
    class="back-btn"
    href="index.html">

    Back To Home

    </a>

  </div>

</div>

</body>

</html>
